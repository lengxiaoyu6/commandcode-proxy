version: "3.9"

services:
  proxy:
    build: .
    ports:
      - "${PROXY_PORT:-3050}:3050"
    environment:
      PORT: "3050"
      # 密码优先从环境变量注入；不设置时回退读容器内 config.json
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      # key 数据存挂载卷，recreate/rebuild 不丢
      KEYS_FILE: "/app/data/keys.json"
    volumes:
      # 挂载宿主机 config.json，改密码/端口无需重新 build
      - ./config.json:/app/config.json:ro
      # 挂载数据目录，key 持久化
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://127.0.0.1:3050/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
